version: "3.8"

services:

  app:
    build: .
    container_name: tarefas-api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./logs:/logs
    environment:
      - KAFKA_SERVER=kafka:9092
    depends_on:
      - kafka
    env_file:
      - .env
    command: ["poetry","run","uvicorn","main:app","--host","0.0.0.0","--port","8000"]
    
    redis:
      image: redis:7-alpine
      container_name: tarefas_redis
      ports:
        - “6379:6379”

    celery:
      build: .
      container_name: tarefas-celery
      command: [”poetry”,”run”,”celery”,”-A”,”celery_app:celery_app”, “worker”,”-Q”,”livros”,”--loglevel-info”]
      volumes:
        - .:/app
      depends_on: 
        - redis
      env_file:
        - .env

    zookeeper:
      image: confluentinc/cp-zookeeper:latest
      ports:
        - "2181:2181"
      environment:
        ZOOKEEPER_CLIENT_PORT: 2181
        ZOOKEEPER_TICK_TIME: 2000

    kafka:
      image: confluentinc/cp-zookeeper:latest
      container_name: tarefas-kafka
      ports:
        - "9092:9092"
      depends_on:
        - zookeeper
      environment:
         KAFKA_BROKER_ID: 1
         KAFKA_ZOOKEEPER_CONNECT: tarefas-zookeeper:2181
         KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
         KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
         KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    kafka-ui:
      image: provectuslabs/kafka-ui:latest
      container_name: tarefas-kafka-ui
      ports:
        - "8080:8080"
      depends_on:
        - kafka
      environment:
        - KAFKA_CLUSTERS_0_NAME=local
        - KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS=kafka:9092

    elasticsearch:
      image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
      container_name: elasticsearch
      environment:
        - discovery.type=single-node
        - xpack.security.enabled=false
        - bootstrap.memory_lock=true
        - ES_JAVA_OPTS=Xms512m -Xmx512m
      unlimits:
        memlock:
          soft: -1
          hard: -1
      volumes:
        - esdata:/usr/share/elasticsearch/data
      ports:
        - "9200:9200"

    kibana:
      image: docker.elastic.co/kibana/kibana:8.11.0
      container_name: kibana
      environment:
        - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      depends_on:
        - elasticsearch
      ports:
        - "5601:5601"

    logstash:
      image: docker.elastic.co/logstash/logstash:8.11.0
      container_name: logstash
      depends_on:
        - elasticsearch
      volumes:
        - ./logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro